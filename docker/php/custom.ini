; Configurações PHP otimizadas para WordPress (PHP 8.3)
upload_max_filesize = 128M
post_max_size = 128M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
date.timezone = America/Sao_Paulo
expose_php = Off

; Tratamento de erros seguro para produção (evita que avisos de depreciação quebrem o layout)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Otimizações de OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
